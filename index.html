  const btnUS = document.getElementById('btn-us');
  const btnMX = document.getElementById('btn-mx');
  const frameUS = document.getElementById('frame-us');
  const frameMX = document.getElementById('frame-mx');
  const note = document.getElementById('mode-note');
  const label = document.getElementById('country-label');

  function decodeBase64Utf8(b64){
    const binary = atob(b64);
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  frameUS.srcdoc = decodeBase64Utf8(US_B64);
  frameMX.srcdoc = decodeBase64Utf8(MX_B64);

  function fitFrame(frame){
    try{
      const doc = frame.contentDocument;
      if (!doc || !doc.documentElement) return;
      const h = Math.max(doc.body ? doc.body.scrollHeight : 0, doc.documentElement.scrollHeight || 0, 1200);
      frame.style.height = h + 'px';
    }catch(e){}
  }

  function attachAutoFit(frame){
    frame.addEventListener('load', () => {
      fitFrame(frame);
      try{
        const body = frame.contentDocument && frame.contentDocument.body;
        if (body && 'ResizeObserver' in window){
          const ro = new ResizeObserver(() => fitFrame(frame));
          ro.observe(body);
        }
        if (frame.contentDocument){
          frame.contentDocument.addEventListener('click', () => setTimeout(() => fitFrame(frame), 50));
          frame.contentDocument.addEventListener('change', () => setTimeout(() => fitFrame(frame), 50));
          frame.contentDocument.addEventListener('input', () => setTimeout(() => fitFrame(frame), 50));
        }
      }catch(e){}
    });
  }

  function setCountry(country){
    const isUS = country === 'us';
    frameUS.hidden = !isUS;
    frameMX.hidden = isUS;
    btnUS.classList.toggle('active', isUS);
    btnMX.classList.toggle('active', !isUS);
    btnUS.setAttribute('aria-pressed', String(isUS));
    btnMX.setAttribute('aria-pressed', String(!isUS));
    document.documentElement.lang = isUS ? 'en' : 'es-MX';
    label.textContent = isUS ? 'Country / Language' : 'País / Idioma';
    note.textContent = isUS ? 'U.S. terminology and U.S. brand references' : 'Terminología clínica y marcas de referencia para México';
    document.title = isUS ? 'Topical Steroid Prescribing Guide — USA' : 'Guía de Corticoides Tópicos — México';
    requestAnimationFrame(() => fitFrame(isUS ? frameUS : frameMX));
  }

  btnUS.addEventListener('click', () => setCountry('us'));
  btnMX.addEventListener('click', () => setCountry('mx'));
  attachAutoFit(frameUS);
  attachAutoFit(frameMX);
  setCountry('us');
